  <!-- Start every visit at the top, never on a restored scroll position -->
  <script>
    // Apply the saved theme before first paint, otherwise a light-mode visitor
    // sees a dark flash while React loads and mounts.
    try {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    } catch (e) {
      /* storage unavailable (private mode) - fall back to the dark theme */
    }

    // Disable browser scroll restoration IMMEDIATELY
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    // Clear any hash from URL
    if (window.location.hash) {
      history.replaceState(null, null, window.location.pathname + window.location.search);
    }

    // <body> does not exist yet inside <head> - only touch what is available.
    window.scrollTo(0, 0);
    if (document.documentElement) {
      document.documentElement.scrollTop = 0;
    }
  </script>
