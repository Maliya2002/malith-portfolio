<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />

  <title>Malith Madushan | Full Stack Developer</title>
  <meta name="description" content="Malith Madushan - Full Stack Web Developer" />

  <!-- Start every visit at the top, never on a restored scroll position -->
  <script>
    // Apply the saved theme before first paint, otherwise a light-mode visitor
    // sees a dark flash while React loads and mounts.
    try {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    } catch (e) {
      /* storage unavailable (private mode) - fall back to the dark theme */
    }

    // Disable browser scroll restoration IMMEDIATELY
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    // Clear any hash from URL
    if (window.location.hash) {
      history.replaceState(null, null, window.location.pathname);
    }

    // <body> does not exist yet inside <head> - only touch what is available.
    window.scrollTo(0, 0);
    if (document.documentElement) {
      document.documentElement.scrollTop = 0;
    }
  </script>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <script>
    // Safety net: force the top once every asset has finished loading, since a
    // late image or font can otherwise leave the browser scrolled mid-page.
    window.addEventListener('load', function() {
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    });
  </script>
</body>
</html>
