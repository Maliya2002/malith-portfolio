<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />

  <title>Malith Madushan | Full Stack Developer</title>
  <meta name="description" content="Malith Madushan - Full Stack Web Developer" />

  <!-- CRITICAL: Force top on every load -->
  <script>
    // Disable browser scroll restoration IMMEDIATELY
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    // Clear any hash from URL
    if (window.location.hash) {
      history.replaceState(null, null, window.location.pathname);
    }

    // Force scroll to top
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  </script>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <script>
    // Force top after page load
    window.addEventListener('load', function() {
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    });
  </script>
</body>
</html>
